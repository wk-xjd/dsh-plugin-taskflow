# TaskFlow bundle patch: one inserted plugin row.
#
# Installed as a profile bundle (`dsh plugin --profile web add dsh-plugin-taskflow`),
# this layer inserts the plugin into the profile's loader graph. Manual installs
# can instead copy this `insert` block into the profile's own cordis.patch.yml.
- insert:
    - id: dsh-plugin-taskflow
      name: 'dsh-plugin-taskflow'
